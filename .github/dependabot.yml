version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
