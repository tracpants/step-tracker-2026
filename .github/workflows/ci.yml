name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:  # Allow manual test + deploy runs

# Least-privilege default; the deploy job raises what it needs.
permissions:
  contents: read

# Cancel superseded runs for PRs, but never cancel a master run mid-deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version-file: .python-version

    - name: Install dependencies
      # --locked fails if uv.lock is out of sync with pyproject.toml
      run: uv sync --locked --extra test

    - name: Run tests
      run: uv run pytest --cov=update_steps --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test:coverage

  deploy:
    name: Deploy to GitHub Pages
    # Only deploy master, and only once both test suites are green
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [python-tests, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage site files
        # Publish only the static site - not the data pipeline, tests, or configs
        run: |
          mkdir _site
          cp index.html embed.html config.js favicon.svg robots.txt CNAME _site/
          cp -r styles _site/styles
          mkdir _site/scripts
          cp scripts/*.js _site/scripts/

      - name: Verify staged site
        run: |
          set -e
          test -f _site/index.html
          test -f _site/scripts/main.js
          if find _site -name '*.test.js' -o -name '__tests__' | grep -q .; then
            echo "Test files leaked into _site" >&2; exit 1
          fi
          # Catch syntax errors before they hit production
          for f in _site/scripts/*.js _site/config.js; do node --check "$f"; done
          find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
